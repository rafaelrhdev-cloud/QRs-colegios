<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pase de Salón</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --ink:#16241f; --paper:#f7f3e8; --paper-2:#efe7d3;
  --green:#1f4b3f; --green-light:#2f6b57; --mustard:#d8a93e; --coral:#c1502e;
  --line: rgba(22,36,31,0.16); --radius: 14px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,"Segoe UI",system-ui,sans-serif;min-height:100vh;}
.app{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:800;font-size:14px;}
.brand-text{line-height:1.1;}
.brand-text .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-light);font-weight:700;}
.brand-text h1{font-size:19px;margin:0;font-weight:800;}
.who{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;}
nav.tabs button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;}
nav.tabs button.active{background:var(--ink);color:var(--paper);}
nav.tabs button:hover:not(.active){background:var(--paper-2);}
.panel{display:none;} .panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.section-title{font-size:15px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--green);margin:0 0 14px;}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--green);}
input, select{width:100%;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:14px;background:var(--paper);color:var(--ink);}
input:focus, select:focus{outline:2px solid var(--green-light);outline-offset:1px;}
.field{margin-bottom:12px;}
.btn{border:none;background:var(--green);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;}
.btn:hover{background:var(--green-light);}
.btn.secondary{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
.btn.secondary:hover{background:var(--paper-2);}
.btn.small{padding:6px 10px;font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--green);}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
.row-actions{display:flex;gap:6px;}
.empty{text-align:center;padding:40px 20px;color:var(--green-light);border:2px dashed var(--line);border-radius:var(--radius);font-size:13px;}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--paper-2);font-size:11px;font-weight:700;color:var(--green);}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--paper-2);border:1.5px solid var(--line);}
.avatar.lg{width:72px;height:72px;}
.badge{width:270px;border-radius:16px;overflow:hidden;background:#fff;border:1.5px solid var(--ink);position:relative;box-shadow:0 3px 0 var(--ink);}
.badge-top{background:var(--green);color:var(--paper);padding:10px 14px;display:flex;align-items:center;gap:8px;}
.badge-top .dot{width:8px;height:8px;border-radius:50%;background:var(--mustard);}
.badge-top span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;}
.badge-body{padding:14px;display:flex;gap:12px;align-items:center;}
.badge-body .info h3{margin:0;font-size:15px;}
.badge-body .info p{margin:2px 0 0;font-size:11.5px;color:var(--green-light);font-weight:600;}
.badge-perforation{height:0;border-top:2px dashed var(--line);position:relative;margin:0 14px;}
.badge-perforation::before, .badge-perforation::after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);}
.badge-perforation::before{left:-22px;} .badge-perforation::after{right:-22px;}
.badge-stub{padding:12px 14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.badge-stub .qr-wrap{background:#fff;padding:4px;border-radius:8px;border:1.5px solid var(--line);}
.badge-stub .code{font-size:10px;color:var(--green-light);font-weight:700;letter-spacing:.05em;}
.limit-banner{background:var(--coral);color:#fff;padding:12px 16px;border-radius:var(--radius);font-weight:700;font-size:13px;margin-bottom:14px;}
.out-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.out-chip{background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;}
.scanner-area{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;}
video{width:100%;max-width:340px;border-radius:10px;border:1.5px solid var(--ink);}
.hint{font-size:12px;color:var(--green-light);margin-top:6px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:100%;max-width:360px;background:#fff;border:1.5px solid var(--ink);border-radius:var(--radius);padding:26px;box-shadow:0 3px 0 var(--ink);}
.auth-toggle{display:flex;gap:6px;margin-bottom:16px;}
.auth-toggle button{flex:1;padding:8px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:12px;cursor:pointer;}
.auth-toggle button.active{background:var(--ink);color:var(--paper);}
.auth-error{color:var(--coral);font-size:12px;font-weight:700;margin-top:8px;min-height:16px;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;}
  header, nav, .no-print{display:none !important;}
}
</style>
</head>

<script type="module">

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* ---------------- DATA (Supabase) ---------------- */
async function loadData(){
  const { data, error } = await supabase.from('app_state').select('data').eq('id',1).single();
  if(error){ toast('No se pudo cargar la información.'); return; }
  if(data && data.data) DATA = data.data;
}
async function saveData(){
  const { error } = await supabase.from('app_state').upsert({ id:1, data: DATA, updated_at: new Date().toISOString() });
  if(error) toast('No se pudo guardar. Revisa tu conexión.');
}

/* ---------------- AUTH ---------------- */
function renderAuth(mode){

      <div class="auth-card">

    const errEl = document.getElementById('authError');

    if(mode==='signup'){
      const name = document.getElementById('authName').value.trim();
      const { data, error } = await supabase.auth.signUp({ email, password: pass, options:{ data:{ full_name: name } } });
      if(error){ errEl.textContent = error.message; return; }
      if(!data.session){ errEl.textContent = 'Cuenta creada. Revisa tu correo para confirmar, o desactiva "Confirm email" en Supabase para pruebas.'; return; }
      SESSION = data.session; await boot();
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });

  };

/* ---------------- TABS ---------------- */
const TABS = [
  {id:'dashboard', label:'Panel'},
  {id:'years', label:'Ciclos escolares'},

    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="brand-mark">HP</div>
          <div class="brand-text"><div class="eyebrow">Pase de Salón</div><h1>Panel escolar</h1></div>

/* ---------------- HELPERS ---------------- */
function yearLabel(id){ const y = DATA.years.find(y=>y.id===id); return y? y.label : '—'; }
function groupLabel(id){ const g = DATA.groups.find(g=>g.id===id); return g? `${g.grade} "${g.name}"` : '—'; }
function studentsInGroup(gid){ return DATA.students.filter(s=>s.groupId===gid); }
function groupsInYear(yid){ return DATA.groups.filter(g=>g.yearId===yid); }
function activeOutForGroup(gid){ return DATA.activePasses.filter(p=>p.groupId===gid); }

/* ---------------- YEARS ---------------- */
function renderYears(root){
  root.innerHTML = `
    <h2 class="section-title">Ciclos escolares</h2>
    <div class="card">
      <div class="grid cols-2"><div class="field"><label>Nombre del ciclo (ej. 2026-2027)</label><input id="yLabel" placeholder="2026-2027"></div></div>
      <button class="btn" id="addYear">Agregar ciclo</button>
    </div>
    ${DATA.years.length ? `<div class="card"><table>
      <tr><th>Ciclo</th><th>Grupos</th><th></th></tr>
      ${DATA.years.map(y=>`<tr><td><strong>${y.label}</strong></td><td>${groupsInYear(y.id).length}</td><td class="row-actions"><button class="btn secondary small" data-del-year="${y.id}">Eliminar</button></td></tr>`).join('')}
    </table></div>` : `<div class="empty">Aún no hay ciclos escolares registrados.</div>`}
  `;
  root.querySelector('#addYear').onclick = async ()=>{
    const val = root.querySelector('#yLabel').value.trim();
    if(!val) return toast('Escribe un nombre de ciclo.');
    DATA.years.push({id:uid(), label:val});
    await saveData(); toast('Ciclo agregado.'); renderPanels();
  };
  root.querySelectorAll('[data-del-year]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delYear;
      if(!confirm('Esto también eliminará los grupos y alumnos de este ciclo. ¿Continuar?')) return;
      const groupIds = groupsInYear(id).map(g=>g.id);
      DATA.students = DATA.students.filter(s=>!groupIds.includes(s.groupId));
      DATA.groups = DATA.groups.filter(g=>g.yearId!==id);
      DATA.years = DATA.years.filter(y=>y.id!==id);
      await saveData(); toast('Ciclo eliminado.'); renderPanels();
    };
  });
}

/* ---------------- GROUPS ---------------- */
function renderGroups(root){
  if(!DATA.years.length){ root.innerHTML = `<div class="empty">Primero da de alta un ciclo escolar.</div>`; return; }
  root.innerHTML = `
    <h2 class="section-title">Grupos</h2>
    <div class="card">
      <div class="grid cols-3">
        <div class="field"><label>Ciclo escolar</label><select id="gYear">${DATA.years.map(y=>`<option value="${y.id}">${y.label}</option>`).join('')}</select></div>
        <div class="field"><label>Grado (ej. 3° Primaria)</label><input id="gGrade" placeholder="3° Primaria"></div>
        <div class="field"><label>Grupo (ej. A)</label><input id="gName" placeholder="A"></div>
      </div>
      <button class="btn" id="addGroup">Agregar grupo</button>
    </div>
    ${DATA.groups.length ? `<div class="card"><table>
      <tr><th>Grupo</th><th>Ciclo</th><th>Alumnos</th><th></th></tr>
      ${DATA.groups.map(g=>`<tr><td><strong>${g.grade} "${g.name}"</strong></td><td>${yearLabel(g.yearId)}</td><td>${studentsInGroup(g.id).length}</td><td class="row-actions"><button class="btn secondary small" data-del-group="${g.id}">Eliminar</button></td></tr>`).join('')}
    </table></div>` : `<div class="empty">Aún no hay grupos registrados.</div>`}
  `;
  root.querySelector('#addGroup').onclick = async ()=>{
    const yearId = root.querySelector('#gYear').value;
    const grade = root.querySelector('#gGrade').value.trim();
    const name = root.querySelector('#gName').value.trim();
    if(!grade || !name) return toast('Completa grado y grupo.');
    DATA.groups.push({id:uid(), yearId, grade, name});
    await saveData(); toast('Grupo agregado.'); renderPanels();
  };
  root.querySelectorAll('[data-del-group]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delGroup;
      if(!confirm('Esto también eliminará a los alumnos de este grupo. ¿Continuar?')) return;
      DATA.students = DATA.students.filter(s=>s.groupId!==id);
      DATA.groups = DATA.groups.filter(g=>g.id!==id);
      DATA.activePasses = DATA.activePasses.filter(p=>p.groupId!==id);
      await saveData(); toast('Grupo eliminado.'); renderPanels();
    };
  });
}

/* ---------------- STUDENTS ---------------- */
function fileToThumb(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 120;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function renderStudents(root){
  if(!DATA.groups.length){ root.innerHTML = `<div class="empty">Primero da de alta un grupo.</div>`; return; }
  const sortedYears = [...DATA.years].sort((a,b)=>b.label.localeCompare(a.label));

        <div class="field"><label>Grupo</label><select id="sGroup"></select></div>
        <div class="field"><label>Nombre completo</label><input id="sName" placeholder="Nombre del alumno"></div>

      </div>
      <button class="btn" id="addStudent">Agregar alumno</button>
    </div>
    <div class="card">
      <div class="grid cols-2">
        <div class="field"><label>Filtrar por ciclo</label><select id="filterYear"><option value="">Todos los ciclos</option>${sortedYears.map(y=>`<option value="${y.id}">${y.label}</option>`).join('')}</select></div>
        <div class="field"><label>Filtrar por grupo</label><select id="filterGroup"><option value="">Todos los grupos</option></select></div>
      </div>
    </div>
    <div id="studentTableWrap"></div>
  `;

  const sYear = root.querySelector('#sYear');
  const sGroup = root.querySelector('#sGroup');
  const filterYear = root.querySelector('#filterYear');
  const filterGroup = root.querySelector('#filterGroup');

  function fillGroupOptions(selectEl, yearId, includeAllOption){
    const groups = DATA.groups.filter(g=>g.yearId===yearId);
    const allOption = includeAllOption ? `<option value="">Todos los grupos</option>` : '';
    selectEl.innerHTML = allOption + (groups.length
      ? groups.map(g=>`<option value="${g.id}">${g.grade} "${g.name}"</option>`).join('')
      : `<option value="" disabled>Este ciclo no tiene grupos todavía</option>`);
  }

  // formulario de alta: cascada ciclo -> grupo
  fillGroupOptions(sGroup, sYear.value, false);
  sYear.onchange = ()=> fillGroupOptions(sGroup, sYear.value, false);

  // filtro de tabla: cascada ciclo -> grupo, con opción "todos"
  function refreshFilterGroups(){
    fillGroupOptions(filterGroup, filterYear.value, true);
  }
  refreshFilterGroups();

  function drawTable(){
    const yearId = filterYear.value;
    const groupId = filterGroup.value;
    let list = DATA.students;
    if(groupId){
      list = list.filter(s=>s.groupId===groupId);
    } else if(yearId){
      const groupIdsInYear = DATA.groups.filter(g=>g.yearId===yearId).map(g=>g.id);
      list = list.filter(s=>groupIdsInYear.includes(s.groupId));
    }
    root.querySelector('#studentTableWrap').innerHTML = list.length ? `<div class="card"><table>
      <tr><th></th><th>Nombre</th><th>Grupo</th><th>Matrícula</th><th></th></tr>
      ${list.map(s=>`<tr><td><img class="avatar" src="${s.photo || placeholderAvatar(s.name)}"></td><td><strong>${s.name}</strong></td><td>${groupLabel(s.groupId)}</td><td>${s.folio||'—'}</td><td class="row-actions"><button class="btn secondary small" data-del-student="${s.id}">Eliminar</button></td></tr>`).join('')}
    </table></div>` : `<div class="empty">No hay alumnos en este filtro.</div>`;
    root.querySelectorAll('[data-del-student]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delStudent;
        DATA.students = DATA.students.filter(s=>s.id!==id);
        DATA.activePasses = DATA.activePasses.filter(p=>p.studentId!==id);
        await saveData(); toast('Alumno eliminado.'); drawTable();
      };
    });
  }
  drawTable();
  filterYear.onchange = ()=>{ refreshFilterGroups(); drawTable(); };
  filterGroup.onchange = drawTable;

  root.querySelector('#addStudent').onclick = async ()=>{
    const groupId = sGroup.value;
    const name = root.querySelector('#sName').value.trim();
    const folio = root.querySelector('#sFolio').value.trim();
    const file = root.querySelector('#sPhoto').files[0];
    if(!groupId) return toast('Este ciclo no tiene grupos. Da de alta uno primero.');
    if(!name) return toast('Escribe el nombre del alumno.');
    let photo = null;
    if(file){ try{ photo = await fileToThumb(file); }catch(e){} }
    DATA.students.push({id:uid(), groupId, name, folio, photo, code: uid()});
    await saveData(); toast('Alumno agregado.');
    root.querySelector('#sName').value=''; root.querySelector('#sFolio').value=''; root.querySelector('#sPhoto').value='';
    drawTable();
  };
}

/* ---------------- BADGES ---------------- */
function renderBadges(root){
  if(!DATA.students.length){ root.innerHTML = `<div class="empty">Da de alta alumnos para generar sus gafetes.</div>`; return; }
  const sortedYears = [...DATA.years].sort((a,b)=>b.label.localeCompare(a.label));
  root.innerHTML = `
    <h2 class="section-title">Gafetes con código QR</h2>
    <div class="card no-print">
      <div class="grid cols-3">
        <div class="field"><label>Ciclo escolar</label><select id="badgeYear"><option value="">Todos los ciclos</option>${sortedYears.map(y=>`<option value="${y.id}">${y.label}</option>`).join('')}</select></div>
        <div class="field"><label>Grupo</label><select id="badgeGroup"><option value="">Todos los grupos</option></select></div>
      </div>
      <button class="btn" id="printBtn">Imprimir gafetes de esta vista</button>
    </div>
    <div id="print-area"><div id="badgeGrid" style="display:flex;flex-wrap:wrap;gap:18px;"></div></div>
  `;
  const badgeYear = root.querySelector('#badgeYear');
  const badgeGroup = root.querySelector('#badgeGroup');

  function fillGroupOptions(){
    const yid = badgeYear.value;
    const groups = yid ? DATA.groups.filter(g=>g.yearId===yid) : DATA.groups;
    badgeGroup.innerHTML = `<option value="">Todos los grupos</option>` + groups.map(g=>`<option value="${g.id}">${g.grade} "${g.name}"</option>`).join('');
  }
  fillGroupOptions();

  function draw(){
    const yid = badgeYear.value;
    const gid = badgeGroup.value;
    let list = DATA.students;
    if(gid){
      list = list.filter(s=>s.groupId===gid);
    } else if(yid){
      const groupIdsInYear = DATA.groups.filter(g=>g.yearId===yid).map(g=>g.id);
      list = list.filter(s=>groupIdsInYear.includes(s.groupId));
    }
    const grid = root.querySelector('#badgeGrid');
    grid.innerHTML = list.length ? list.map(s=>`
      <div class="badge-wrap" data-student-id="${s.id}">
        <div class="badge">
          <div class="badge-top"><div class="dot"></div><span>Pase de salón · Gafete</span></div>
          <div class="badge-body">
            <img class="avatar lg" src="${s.photo || placeholderAvatar(s.name)}">
            <div class="info"><h3>${s.name}</h3><p>${groupLabel(s.groupId)}</p><p>${s.folio ? 'Matrícula '+s.folio : yearLabel((DATA.groups.find(g=>g.id===s.groupId)||{}).yearId)}</p></div>
          </div>
          <div class="badge-perforation"></div>
          <div class="badge-stub"><div class="qr-wrap" id="qr-${s.id}"></div><div class="code">CÓDIGO<br>${s.code}</div></div>
        </div>
        <button class="btn small secondary no-print" style="margin-top:8px;width:270px;" data-print-single="${s.id}">Imprimir este gafete</button>
      </div>
    `).join('') : '';
    const existingEmpty = root.querySelector('.no-print-empty');
    if(existingEmpty) existingEmpty.remove();
    if(!list.length){
      grid.insertAdjacentHTML('beforebegin', `<div class="empty no-print-empty">No hay alumnos en este filtro.</div>`);
      return;
    }
    list.forEach(s=>{
      const el = document.getElementById('qr-'+s.id);
      if(el) {
        el.innerHTML = "";
        const qrUrl = window.location.href.split('?')[0] + "?pass=" + s.code;
        new QRCode(el, {
          text: qrUrl,
          width: 130,
          height: 130,
          colorDark: '#16241f',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    });
    root.querySelectorAll('[data-print-single]').forEach(b=>{
      b.onclick = ()=>printSingle(b.dataset.printSingle);
    });
  }

  function printSingle(id){
    const wraps = root.querySelectorAll('.badge-wrap');
    const prevDisplay = [];
    wraps.forEach(w=>{
      prevDisplay.push([w, w.style.display]);
      w.style.display = (w.dataset.studentId === id) ? '' : 'none';
    });
    let restored = false;
    const restore = ()=>{
      if(restored) return;
      restored = true;
      prevDisplay.forEach(([w,d])=> w.style.display = d);
      window.removeEventListener('afterprint', restore);
    };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 3000);
  }

  draw();
  badgeYear.onchange = ()=>{ fillGroupOptions(); draw(); };
  badgeGroup.onchange = draw;
  root.querySelector('#printBtn').onclick = ()=>window.print();
}

/* ---------------- SCANNER ---------------- */
let scannerStream = null, scannerLoopId = null;
function renderScanner(root, presetGroupId){
  if(!DATA.groups.length){ root.innerHTML = `<div class="empty">Primero da de alta grupos y alumnos.</div>`; return; }
  const chosenGroupId = presetGroupId || DATA.groups[0].id;
  root.innerHTML = `
    <h2 class="section-title">Pase de baño / dirección</h2>
    <div class="card"><div class="field" style="max-width:320px;"><label>¿Qué grupo estás atendiendo?</label><select id="scanGroup">${DATA.groups.map(g=>`<option value="${g.id}" ${g.id===chosenGroupId?'selected':''}>${g.grade} "${g.name}" · ${yearLabel(g.yearId)}</option>`).join('')}</select></div></div>
    <div id="limitArea"></div>
    <div class="grid cols-2">
      <div class="card"><h3 style="margin-top:0;font-size:14px;">Escanear con cámara</h3>
        <div class="scanner-area"><video id="video" playsinline muted style="display:none;"></video>
          <div id="camIdle"><button class="btn" id="startCam">Activar cámara</button><p class="hint">Necesita permiso de cámara del navegador.</p></div>
        </div>
      </div>
      <div class="card"><h3 style="margin-top:0;font-size:14px;">Registrar manualmente</h3>
        <div class="field"><label>Buscar alumno</label><input id="manualSearch" placeholder="Escribe un nombre..."></div>
        <div id="manualResults" style="max-height:180px;overflow:auto;"></div>
      </div>
    </div>
  `;
  const groupSelect = root.querySelector('#scanGroup');
  function drawLimit(){
    const out = activeOutForTeacher(SESSION.user.id);
    const max = teacherMaxOut();
    const area = root.querySelector('#limitArea');
    if(out.length >= max){
      area.innerHTML = `<div class="limit-banner">⚠ Límite alcanzado: ya tienes ${max} alumno${max===1?'':'s'} fuera contigo.
        <div class="out-list">${out.map(p=>{ const s = DATA.students.find(s=>s.id===p.studentId); return `<div class="out-chip" style="background:var(--coral);color:#fff;border-color:#fff;">${s?s.name:'—'} · ${groupLabel(p.groupId)}</div>`; }).join('')}</div></div>`;
    } else {
      area.innerHTML = out.length ? `<div class="card"><div class="pill">Contigo, fuera ahora (${out.length}/${max})</div><div class="out-list">${out.map(p=>{ const s = DATA.students.find(s=>s.id===p.studentId); return `<div class="out-chip">${s?s.name:'—'} · ${groupLabel(p.groupId)}</div>`; }).join('')}</div></div>` : '';
    }
  }
  drawLimit();
  groupSelect.onchange = ()=>{ drawLimit(); drawResults(); };
async function handleScan(rawCode){
    if(!rawCode) return;
    let cleanCode = rawCode.trim();

    if(cleanCode.includes('?pass=')) {
      const parts = cleanCode.split('?pass=');
      cleanCode = parts[1] ? parts[1].trim() : cleanCode;
    }

    const gid = groupSelect.value;
    const student = DATA.students.find(s=>s.code.trim() === cleanCode);
    if(!student) return; // Si no lo reconoce, ignoramos temporalmente para seguir buscando

    // ===== CIERRE AUTOMÁTICO DE CÁMARA Y COOLDOWN =====
    stopCamera(); // Apaga la cámara al instante de leer un código válido
    
    // Mostramos feedback visual de que leyó al alumno
    toast(`Procesando a ${student.name}...`);

    const activeForStudent = DATA.activePasses.find(p=>p.studentId===student.id);
    if(activeForStudent){
      DATA.activePasses = DATA.activePasses.filter(p=>p.studentId!==student.id);
      DATA.history.unshift({id:uid(), studentId:student.id, groupId:gid, out:activeForStudent.time, in:Date.now(), by: teacherName()});
      await saveData(); 
      toast(`${student.name} regresó al salón.`); 
      renderScanner(root, gid);
      return;
    }

    if(student.groupId !== gid){ 
      if(!confirm(`${student.name} pertenece a otro grupo. ¿Registrar salida de todos modos?`)) {
        return; 
      }
    }

    const out = activeOutForTeacher(SESSION.user.id);
    const max = teacherMaxOut();
    if(out.length >= max){ 
      toast(`Límite alcanzado: ya tienes ${max} alumno${max===1?'':'s'} fuera.`); 
      return; 
    }

    DATA.activePasses.push({studentId:student.id, groupId:gid, teacherId:SESSION.user.id, time:Date.now(), by: teacherName()});
    await saveData(); 
    toast(`${student.name} salió del salón.`); 
    renderScanner(root, gid);
  }

  const searchInput = root.querySelector('#manualSearch');
  function drawResults(){
    const q = searchInput.value.trim().toLowerCase();
    const results = q ? DATA.students.filter(s=>s.name.toLowerCase().includes(q)) : studentsInGroup(groupSelect.value);
root.querySelector('#manualResults').innerHTML = results.slice(0,8).map(s=>{
      const isOut = DATA.activePasses.some(p=>p.studentId===s.id);
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);"><span style="font-size:13px;">${s.name} <span class="hint">(${groupLabel(s.groupId)})</span></span><button class="btn small ${isOut?'secondary':''}" data-code="${s.code}">${isOut? 'Registrar regreso':'Dar pase'}</button></div>`;
    }).join('') || `<p class="hint">Sin resultados.</p>`;
    root.querySelectorAll('[data-code]').forEach(b=>{ b.onclick = ()=>handleScan(b.dataset.code); });
  }
  drawResults();
  searchInput.oninput = drawResults;
root.querySelector('#startCam').onclick = async ()=>{
    const video = root.querySelector('#video');
    try{
      scannerStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = scannerStream; 
      video.style.display = 'block';
      root.querySelector('#camIdle').style.display = 'none';
      
      // Forzar reproducción en dispositivos móviles (iOS / Android)
      video.setAttribute('playsinline', 'true');
      await video.play();

      const canvas = document.createElement('canvas'); 
      const ctx = canvas.getContext('2d');
      let lastCode = null, lastTime = 0;

      function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth; 
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "dontInvert",
          });

          if (code) {
            const now = Date.now();
            if (code.data !== lastCode || now - lastTime > 3000) {
              lastCode = code.data; 
              lastTime = now; 
              handleScan(code.data);
            }
          }
        }
        scannerLoopId = requestAnimationFrame(tick);
      }
      
      // Iniciar el escaneo de forma explícita
      tick();

    }catch(e){ 
      console.error(e);
      alert('Error de cámara: ' + e.message + '. Asegúrate de usar HTTPS y dar permisos.');
      toast('No se pudo activar la cámara.'); 
    }
  };
}
function stopCamera(){
  if(scannerLoopId) cancelAnimationFrame(scannerLoopId);
  if(scannerStream) scannerStream.getTracks().forEach(t=>t.stop());
  scannerStream = null; scannerLoopId = null;

  // Restauramos la interfaz del escáner para que vuelva a mostrar el botón "Activar cámara"
  const video = document.getElementById('video');
  const camIdle = document.getElementById('camIdle');
  if(video) video.style.display = 'none';
  if(camIdle) camIdle.style.display = 'block';
}

/* ---------------- HISTORY ---------------- */
function renderHistory(root){
  if(!DATA.history.length){ root.innerHTML = `<div class="empty">Aún no hay pases registrados.</div>`; return; }
  const rows = [...DATA.history].sort((a,b)=>b.in-a.in);
  root.innerHTML = `
    <h2 class="section-title">Historial de pases</h2>
    <div class="card"><table>
      <tr><th>Alumno</th><th>Grupo</th><th>Salió</th><th>Regresó</th><th>Duración</th><th>Registró</th></tr>
      ${rows.map(h=>{
        const s = DATA.students.find(s=>s.id===h.studentId);
        const mins = Math.max(1, Math.round((h.in - h.out)/60000));
        return `<tr><td><strong>${s? s.name : '—'}</strong></td><td>${groupLabel(h.groupId)}</td><td>${new Date(h.out).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td>${new Date(h.in).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td>${mins} min</td><td>${h.by||'—'}</td></tr>`;
      }).join('')}
    </table></div>
  `;
}

/* ---------------- TIEMPO REAL ---------------- */
let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supabase
    .channel('app_state-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state', filter: 'id=eq.1' }, (payload) => {
      if(payload.new && payload.new.data){
        DATA = payload.new.data;
        // Si hay una cámara activa en este dispositivo, no la interrumpimos;
        // el conteo se refrescará solo en cuanto termine ese escaneo.
        if(scannerStream) return;
        renderPanels();
      }
    })
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
}

/* ---------------- BOOT ---------------- */
async function boot(){
  await loadData();
  renderApp();
  subscribeRealtime();

  // Detectar si se abrió escaneando un QR con ?pass=
// Detectar si se abrió escaneando un QR con ?pass=
  const urlParams = new URLSearchParams(window.location.search);
  const passCode = urlParams.get('pass');
  if(passCode) {
    activeTab = 'scanner';
    renderTabs(); 
    renderPanels();
    
    setTimeout(async () => {
      let student = DATA.students.find(s => s.code.trim() === passCode.trim());
      if(student) {
        // Determinamos el grupo del alumno
        const gid = student.groupId;
        
        // Verificamos si ya estaba fuera
        const activeIndex = DATA.activePasses.findIndex(p => p.studentId === student.id);

        if(activeIndex !== -1) {
          // Estaba fuera -> REGRESA AL SALÓN
          const activeForStudent = DATA.activePasses[activeIndex];
          DATA.activePasses.splice(activeIndex, 1);
          
          DATA.history.unshift({
            id: uid(), 
            studentId: student.id, 
            groupId: gid, 
            out: activeForStudent.time, 
            in: Date.now(), 
            by: teacherName()
          });
          
          await saveData();
          toast(`${student.name} regresó al salón.`);
        } else {
          // Estaba dentro -> SALE DEL SALÓN
          const outForTeacher = activeOutForTeacher(SESSION.user.id);
          const max = teacherMaxOut();
          if(outForTeacher.length >= max) {
            toast(`Límite alcanzado: ya tienes ${max} alumno${max===1?'':'s'} fuera.`);
          } else {
            DATA.activePasses.push({
              studentId: student.id, 
              groupId: gid, 
              teacherId: SESSION.user.id,
              time: Date.now(), 
              by: teacherName()
            });
            
            await saveData();
            toast(`${student.name} salió del salón.`);
          }
        }

        // Redibujamos todo el panel del escáner conservando el grupo, para que
        // el conteo de "quiénes están afuera" quede siempre consistente.
        const scannerPanel = document.getElementById('panel-scanner');
        if(scannerPanel) renderScanner(scannerPanel, gid);

      } else {
        toast('Código QR no encontrado en el sistema.');
      }
      
      // Limpiamos la URL para evitar que se repita la acción al recargar
      window.history.replaceState({}, document.title, window.location.pathname);
    }, 500);
  }
}
(async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session){ SESSION = session; await boot(); }
  else { renderAuth('login'); }
  supabase.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){ SESSION = null; }
  });
})();
</script>
